{% extends "base.html" %}{% block content %}<section class="card"><h2>Painel</h2><div class="stats"><div><strong>{{ total }}</strong><span>Total</span></div><div><strong>{{ pending }}</strong><span>Pendentes</span></div><div><strong>{{ analysis }}</strong><span>Em análise</span></div><div><strong>{{ released }}</strong><span>Liberados</span></div></div><h3>Últimas requisições</h3>{% for r in latest %}<div class="mini-list"><strong>{{ r.number }}</strong> — {{ r.patient }} — {{ r.status }}</div>{% else %}<p>Nenhuma requisição.</p>{% endfor %}</section>{% endblock %}
