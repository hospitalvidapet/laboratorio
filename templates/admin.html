{% extends "base.html" %}{% block content %}<section class="card"><h2>Administração</h2><form class="panel" method="post"><h3>Novo usuário</h3><label>Nome</label><input name="name" required><label>E-mail</label><input name="email" type="email" required><label>Senha</label><input name="password" required><label>Perfil</label><select name="profile"><option value="requisitante">Requisitante</option><option value="laboratorio">Laboratório</option><option value="admin">Administrador</option></select><button>Criar usuário</button></form><h3>Usuários</h3>{% for u in users %}<div class="panel">{{ u.name }} — {{ u.email }} — {{ u.profile }}</div>{% endfor %}</section>{% endblock %}
