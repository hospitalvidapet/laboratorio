{% extends "base.html" %}{% block content %}<section class="card"><h2>Clínicas</h2><form method="post" class="panel"><input name="name" placeholder="Nome" required><input name="cnpj" placeholder="CNPJ"><input name="phone" placeholder="Telefone"><input name="email" placeholder="E-mail"><button>Cadastrar</button></form>{% for c in rows %}<div class="panel"><form method="post" action="{{url_for('admin.edit_clinic',id=c.id)}}"><input name="name" value="{{c.name}}"><input name="cnpj" value="{{c.cnpj or ''}}"><input name="phone" value="{{c.phone or ''}}"><input name="email" value="{{c.email or ''}}"><select name="active"><option value="1" {% if c.active %}selected{% endif %}>Ativa</option><option value="0" {% if not c.active %}selected{% endif %}>Inativa</option></select><button>Salvar</button></form><form method="post" action="{{url_for('admin.delete_clinic',id=c.id)}}"><button class="danger">Excluir/Inativar</button></form></div>{% endfor %}</section>{% endblock %}
