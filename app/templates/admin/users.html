{% extends "base.html" %}{% block content %}<section class="card"><h2>Usuários</h2><form method="post" class="panel"><input name="name" placeholder="Nome" required><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha criada pelo administrador" required><select name="role"><option value="admin">Administrador</option><option value="laboratorio">Laboratório</option><option value="requisitante">Requisitante</option></select><button>Criar</button></form>{% for u in rows %}<div class="panel"><form method="post" action="{{url_for('admin.edit_user',id=u.id)}}"><input name="name" value="{{u.name}}"><input name="email" value="{{u.email}}"><select name="role"><option value="admin" {% if u.role=='admin' %}selected{% endif %}>Administrador</option><option value="laboratorio" {% if u.role=='laboratorio' %}selected{% endif %}>Laboratório</option><option value="requisitante" {% if u.role=='requisitante' %}selected{% endif %}>Requisitante</option></select><select name="active"><option value="1" {% if u.active %}selected{% endif %}>Ativo</option><option value="0" {% if not u.active %}selected{% endif %}>Inativo</option></select><input name="password" type="password" placeholder="Nova senha (opcional)"><button>Salvar</button></form><form method="post" action="{{url_for('admin.delete_user',id=u.id)}}"><button class="danger">Excluir/Inativar</button></form></div>{% endfor %}</section>{% endblock %}
