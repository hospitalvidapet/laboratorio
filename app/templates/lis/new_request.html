{% extends "base.html" %}{% block content %}<section class="card"><h2>Nova requisição</h2><form method="post"><div class="grid three"><select name="clinic_id" required>{% for c in clinics %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="veterinarian" placeholder="Veterinário" required><input name="crmv" placeholder="CRMV"></div><h3>Paciente</h3><div class="grid three"><input name="patient_name" placeholder="Paciente" required><input name="tutor_name" placeholder="Tutor" required><input name="tutor_phone" placeholder="Telefone"><select name="species" required>{% for s in species %}<option value="{{s.name}}">{{s.name}}</option>{% endfor %}</select><input name="breed" placeholder="Raça"><select name="sex"><option>Fêmea</option><option>Macho</option><option>Não informado</option></select><div><label>Anos</label><input name="age_years" type="number" min="0" value="0"></div><div><label>Meses</label><input name="age_months" type="number" min="0" max="11" value="0"></div><input name="weight" placeholder="Peso"></div><h3>Perfis</h3>{% for p in profiles %}<label class="choice"><input type="checkbox" name="profiles" value="{{p.name}}"> <b>{{p.name}}</b> — {{p.exams|join(', ')}}</label>{% endfor %}<h3>Exames individuais</h3>{% for g,items in grouped %}<div class="panel"><h4>{{g.name}}</h4>{% for e in items %}<label class="choice"><input type="checkbox" name="exams" value="{{e.name}}"> {{e.name}} — {{e.material or '-'}}</label>{% endfor %}</div>{% endfor %}<h3>Amostras</h3>{% for s in samples %}<label class="choice"><input type="checkbox" name="samples" value="{{s.name}}"> {{s.name}}</label>{% endfor %}<select name="priority"><option>Rotina</option><option>Urgente</option><option>Emergência</option></select><label>Histórico clínico</label><textarea name="clinical_history"></textarea><label>Suspeita diagnóstica</label><textarea name="diagnostic_suspicion"></textarea><label>Medicações em uso</label><textarea name="medications"></textarea><label>Observações</label><textarea name="observations"></textarea><button>Enviar requisição</button></form></section>{% endblock %}
