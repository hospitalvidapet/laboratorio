{% extends "base.html" %}{% block content %}<section class="card"><h2>Resultados — {{row.number}}</h2><form method="post" class="panel"><select name="exam_name">{% for e in row.all_exams %}<option>{{e}}</option>{% endfor %}</select><input name="parameter" placeholder="Parâmetro" required><input name="result_value" placeholder="Resultado"><input name="unit" placeholder="Unidade"><input name="reference_value" placeholder="Referência"><select name="flag"><option></option><option>Baixo</option><option>Alto</option><option>Crítico</option></select><input name="method" placeholder="Método"><textarea name="observations" placeholder="Observações"></textarea><button>Salvar resultado</button></form>{% for r in row.results %}<div class="row">{{r.exam_name}} — {{r.parameter}}: {{r.result_value}} {{r.unit or ''}} | Ref.: {{r.reference_value or '-'}}</div>{% else %}<p>Nenhum resultado.</p>{% endfor %}<form method="post" action="{{url_for('lis.generate_pdf',request_id=row.id)}}"><button>Gerar PDF e liberar</button></form></section>{% endblock %}
